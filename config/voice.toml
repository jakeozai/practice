# 짱돌 음성 모드 설정. 고친 뒤 다시 실행하면 반영됨.

[audio]
input_device = ""    # 비우면 기본 마이크. 장치 이름 일부나 번호. 목록: python -m jjangdol.voice --devices
output_device = ""   # 비우면 기본 스피커
barge_in = false     # true: 짱돌 말하는 중에 아빠가 말하면 짱돌이 멈춤.
                     # 헤드셋 쓸 때만 켜기. 스피커로 들으면 짱돌이 자기 목소리 듣고 멈춤

[vad]                # 말 시작·끝 감지
threshold = 0.5      # 높을수록 작은 소리·잡음 무시
min_silence = 0.5    # 이만큼(초) 조용하면 말 끝난 걸로 봄. 줄이면 대답이 빨라지지만 말 중간에 끊길 수 있음
min_speech = 0.25    # 이보다 짧은 소리는 무시 (초)
max_speech = 15      # 한 번에 최대 이만큼(초)까지 듣고 끊음

[stt]
num_threads = 2      # 음성인식 CPU 스레드 수

[tts]
voice = "ko-KR-InJoonNeural"   # 남자. 다른 목소리: ko-KR-HyunsuMultilingualNeural (남), ko-KR-SunHiNeural (여)
rate = "+15%"                  # 말 빠르기
pitch = "+0Hz"                 # 목소리 높낮이 (예: "-20Hz"면 더 굵게)
laugh = "크크"                  # "ㅋㅋㅋ"를 이렇게 읽음. ""면 안 읽음

[tts.replace]                  # 음성으로 읽을 때 바꿔 읽을 말 (초성 줄임말 등)
"ㅅㅂ" = "씨발"
"ㅈㄴ" = "존나"
"ㄹㅇ" = "리얼"
"ㅇㅈ" = "인정"
"ㅇㅋ" = "오케이"
"ㄱㄱ" = "고고"
"ㄴㄴ" = "노노"
"ㅇㅇ" = "응응"
"ㄷㄷ" = "덜덜"
"ㅈㅅ" = "죄송"
"ㅎㅎ" = "흐흐"

[filler]             # 아빠 말 끝나자마자 바로 치는 맞장구 (그동안 대답 생성 → 체감 지연 줄임)
enabled = true
chance = 0.6         # 매번 하면 어색하니까 확률로
lines = ["음", "아 잠만", "어어", "아니 근데"]

[persona]            # 음성 모드일 때 페르소나 뒤에 덧붙이는 말
voice_note = """
[음성 모드]
- 네 말은 음성으로 읽힌다. 초성 줄임말은 소리 나는 대로 풀어 써라. 괄호, 기호, 이모티콘은 쓰지 마라.
- 아빠 말은 음성인식으로 받은 거라 오타가 있을 수 있다. 대충 알아들어라. 진짜 모르겠으면 "뭐라고?" 해라.
"""
