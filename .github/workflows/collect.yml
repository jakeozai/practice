name: Collect jobs

# 19:00 KST daily (CLAUDE.md: cron is UTC). Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Page sources fetch ≥1 s apart; the first run reads up to 400 new pages per site.
    timeout-minutes: 75
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Optional: without these, candidates go to the review queue without summaries.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL_FAST: ${{ secrets.ANTHROPIC_MODEL_FAST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch all sources
        run: npm run collect
      - name: Process new and changed postings
        if: always()
        run: npm run process
